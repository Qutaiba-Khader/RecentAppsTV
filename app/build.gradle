plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.websnake.recentstv'
    compileSdk 35

    defaultConfig {
        applicationId "com.websnake.recentstv"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    buildTypes {
        release {
            // R8: Compose runs markedly faster optimised. Framework reflection targets
            // boot-classpath classes (never renamed); Shizuku is kept by proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            enableUnitTestCoverage true   // JaCoCo XML for the flowmap gate
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }

}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'

    // Compose for TV
    implementation 'androidx.tv:tv-material:1.0.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // DataStore for settings persistence
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Shizuku (same versions as the working force-stop app)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Hidden API blocklist bypass for privileged framework reflection
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // Installs the bundled baseline profiles (Compose + app) so hot paths are AOT-compiled
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    testImplementation 'junit:junit:4.13.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
